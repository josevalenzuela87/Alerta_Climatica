<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AlertaClimática</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner-overlay d-none">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <i class="fas fa-sign-in-alt"></i>
                <h2 class="mb-0">Iniciar Sesión</h2>
                <p class="mb-0 mt-2">Accede a tu cuenta de AlertaClimática</p>
            </div>

            <!-- Body -->
            <div class="auth-body">
                <!-- Alert Messages -->
                <div id="alertMessage" class="alert d-none" role="alert"></div>

                <!-- Login Form -->
                <form id="loginForm" novalidate>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            <i class="fas fa-envelope me-1"></i>
                            Correo Electrónico
                        </label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            name="email"
                            placeholder="ejemplo@correo.com"
                            required
                            autocomplete="email"
                        >
                        <div class="invalid-feedback">
                            Por favor, ingresa un correo electrónico válido.
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-1"></i>
                            Contraseña
                        </label>
                        <div class="input-group">
                            <input 
                                type="password" 
                                class="form-control" 
                                id="password" 
                                name="password"
                                placeholder="••••••••"
                                required
                                autocomplete="current-password"
                            >
                            <button 
                                class="btn btn-outline-secondary" 
                                type="button" 
                                id="togglePassword"
                                title="Mostrar/Ocultar contraseña"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback">
                            Por favor, ingresa tu contraseña.
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="mb-3 form-check">
                        <input 
                            type="checkbox" 
                            class="form-check-input" 
                            id="rememberMe"
                            name="rememberMe"
                        >
                        <label class="form-check-label" for="rememberMe">
                            Recordarme
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 btn-auth">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Iniciar Sesión
                    </button>
                </form>

                <!-- Links -->
                <div class="text-center">
                    <p class="mb-2">
                        <a href="#" class="text-link">¿Olvidaste tu contraseña?</a>
                    </p>
                    <p class="mb-0">
                        ¿No tienes cuenta? 
                        <a href="register.html" class="text-link fw-bold">Regístrate aquí</a>
                    </p>
                    <hr class="my-3">
                    <p class="mb-0">
                        <a href="../index.html" class="text-link">
                            <i class="fas fa-home me-1"></i>
                            Volver al inicio
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="../config/firebase-config.js?v=1.2"></script>
    <script src="../config/env-loader.js?v=1.2"></script>
    <script src="../utils/Validator.js?v=1.2"></script>
    <script src="../services/FirebaseService.js?v=1.2"></script>
    <script src="../repositories/AuthRepository.js?v=1.2"></script>
    <script src="../controllers/AuthController.js?v=1.2"></script>
    <script src="../assets/js/login.js?v=1.2"></script>
</body>
</html>
